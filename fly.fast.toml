app = "telegram-bridge"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.fast"
  # The fast image is built and pushed by scripts/deploy-fast.sh. Fly Machines
  # currently run on x86_64, while local smoke images may target arm64.

[env]
  PORT = "8080"
  TELEGRAM_BRIDGE_DB = "/data/telegram-bridge.db"
  TELEGRAM_BRIDGE_SESSION = "/data/telegram.session"

[mounts]
  source = "telegram_bridge_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
