app = "tg-radar"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.fast"
  # The fast image is built and pushed by scripts/deploy-fast.sh. Fly Machines
  # currently run on x86_64, while local smoke images may target arm64.

[env]
  PORT = "8080"
  TG_RADAR_DB = "/data/tg-radar.db"
  TG_RADAR_SESSION = "/data/telegram.session"

[mounts]
  source = "tg_radar_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
