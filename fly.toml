app = "tg-radar"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  # Fly Machines currently run on x86_64. Apple container can cross-build the
  # deployment image locally; the Dockerfile itself remains architecture-neutral.

[env]
  PORT = "8080"
  TG_RADAR_DB = "/data/tg-radar.db"
  TG_RADAR_SESSION = "/data/telegram.session"

[mounts]
  source = "tg_radar_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
