app = "telegram-bridge"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  # Fly Machines currently run on x86_64. Apple container can cross-build the
  # deployment image locally; the Dockerfile itself remains architecture-neutral.

[env]
  PORT = "8080"
  TELEGRAM_BRIDGE_DB = "/data/telegram-bridge.db"
  TELEGRAM_BRIDGE_SESSION = "/data/telegram.session"
  TELEGRAM_BRIDGE_MEDIA_DIR = "/data/media"
  TELEGRAM_BRIDGE_MEDIA_ENABLED = "false"
  TELEGRAM_BRIDGE_MEDIA_DAILY_BUDGET_MICROUSD = "1000000"
  TELEGRAM_BRIDGE_MEDIA_TOTAL_BUDGET_MICROUSD = "5000000"

[mounts]
  source = "telegram_bridge_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
