interface:
  display_name: "Telegram Bridge"
  short_description: "Search Telegram and process requested media"
  default_prompt: "Use $telegram-bridge to search my Telegram chats for a recent conversation or listing."
dependencies:
  tools:
    - type: "mcp"
      value: "telegram-bridge"
      description: "Telegram search, private downloads, and explicitly requested cloud recognition"
      transport: "streamable_http"
      url: "https://telegram-bridge.fly.dev/mcp"
policy:
  allow_implicit_invocation: true
