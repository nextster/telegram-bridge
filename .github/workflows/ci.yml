name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify service and repository-owned integration files
        env:
          SKIP_CODEX_PLUGIN_VALIDATE: "1"
        run: scripts/check.sh
